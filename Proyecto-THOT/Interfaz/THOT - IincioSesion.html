<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Entra al sitio | THOT</title>
		<link rel="icon" href="../Imagenes/Logo-uleam.png">
		<link rel="stylesheet" type="text/css" href="../Estilo/THOT - InicioSesison.css">
		
	</head>

	<body>
		<div>

			<header id="cabezera">
				<section id="cabezera_principal">
					<div id="cabeza_izquierda">
						<img src="../Imagenes/logo_uleam_dorado.png" id="logo">
						<div id="pagina_principal">
							<H2 id="texto_cabezera"><strong>ULEAM</strong> </H2>
						</div>
					</div>	
					<div id="cabezara_derecha"> 
						<div id="pagina_principal">
							<H2 id="texto_cabezera"><strong>THOT</strong> </H2>
						</div>
						<img src="../Imagenes/logo_thot.png" id="logo">
					</div>
				</section>
			</header>
				
			<nav>
				<section id="seccion">
    				<div id="contenedor_login">
    				    <h1 id="titulo"><strong>THOT</strong></h1>
    				    <h2 id="titulo">Inicio de sesión</h2>

    				    <form id="formulario_login" method="post">
    				        <input type="text" id="usuario" placeholder="Cédula o correo (1234567890@uleam.com)" autocomplete="username" required>
    				        <br>
    				        <input type="password" id="contrasena" placeholder="Ingrese su contraseña" autocomplete="current-password" required>
<p id="mensaje_login" role="alert"></p>
    				        <br>
							<a id="recuperar" href="#">¿Olvidó su contraseña?</a>
							<br>
    				        <input type="submit" value="Entrar" id="boton_entrar">
    				        
    				    </form>
						<br>
						<hr class="linea">
						<br>
						<div id="contendor_365"> 
							<h2 id="titulo" class="titulo_365">Identifíquese usando su cuenta en:</h2>
							<input type="submit" value="Microsoft 365 uleam" id="inicio_365">
						</div>
						<br>
						<hr class="linea">
					</div>
					
				</section>

			</nav>

			<footer id="pie">
				<section id="pie_pagina">
					<div id="pie_izquierda">
						<img src="../Imagenes/LOGO-ULEAM-H2.png" id="logo_pie">
					</div>

				</section>		
			</footer>
		</div>
	<script src="thot-comun.js"></script>
<script>
document.getElementById("formulario_login").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("mensaje_login"), boton = document.getElementById("boton_entrar");
  msg.textContent = ""; boton.disabled = true;
  try {
    const r = await THOT.post("/api/login", {
      usuario: document.getElementById("usuario").value.trim(),
      contrasena: document.getElementById("contrasena").value
    });
    location.href = r.paginaInicial;
  } catch (err) {
    msg.textContent = err.message;
    boton.disabled = false;
  }
});
</script>
</body>
</html>
